name: My First CI

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello from my CI pipeline!"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}:latest .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}:latest

      - name: Simulate Deployment (Pull imgae)
        run: docker pull ghcr.io/${{ github.repository }}:latest

      - name: Simulate Deployment (Run container)
        run: docker run -d -p 8080:80 --name deployed-app ghcr.io/${{ github.repository }}:latest

      - name: Debug container status
        run: |
          sleep 3
          docker ps -a
          docker logs deployed-app

      - name: Check Deployment is alive
        run: curl -4 -f http://localhost:8080 || exit 1
